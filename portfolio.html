  <style>
    :root {
      --bg: #0b0b0d;
      --fg: #ededea;
      --muted: #8b8b86;
      --line: #222226;
      --accent: #ffffff;
      --accent-fg: #000000;
      --shadow: rgba(0, 0, 0, 0.7);
      --sans: "Geist", "Space Mono", "Helvetica Neue", Arial, sans-serif;
      --mono: "PT Mono", "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

    /* ---------- PRELOADER ---------- */
    #preloader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .preloader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    #preloader img {
      max-width: 130px;
      width: 18vw;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .preloader-progress {
      color: #777770;
      font-size: 11px;
      letter-spacing: .12em;
    }
    body.preloader-done #preloader {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------- HEADER VISIBILE ---------- */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10000;
      opacity: 1 !important;
      visibility: visible !important;
    }
    .top-header::before {
      background: rgba(11, 11, 13, 0.5);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }
    .top-left .brand,
    .top-left .role,
    .top-nav a {
      opacity: 1 !important;
      visibility: visible !important;
    }
    .top-line {
      position: fixed;
      top: 40px;
      left: 0;
      right: 0;
      z-index: 9999;
    }

    /* ---------- HERO & STACK 3D ---------- */
    .hero {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    body.preloader-done .hero {
      opacity: 1;
    }
    .stack {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: var(--w);
      transform: translateX(-50%);
      touch-action: none;
    }
    .scene {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      pointer-events: none;
    }
    .scene .card { pointer-events: auto; }
    .card {
      position: absolute;
      top: 50%;
      display: block;
      border-radius: 6px;
      overflow: hidden;
      will-change: transform, opacity;
      transform-origin: 50% 100%;
      outline: none;
      cursor: pointer;
      background: #151518;
      box-shadow: 0 16px 36px -10px rgba(0,0,0,0.65);
      user-select: none;
      -webkit-user-select: none;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }
    .card.is-open {
      box-shadow: 0 32px 75px -20px var(--shadow);
    }
    .scene.has-sel .card { pointer-events: none; }
    .scene.has-sel .card.is-selected { pointer-events: auto; }
    .card:focus-visible::after {
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    /* Contenuto Multimediale delle Card */
    .card-media {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #121215;
    }
    .card-media img,
    .card-media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }
    .card-media.lottie-container {
      background: #0e0e11;
      padding: 14px;
    }
    .card-media.lottie-container svg {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .card-link-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #151519;
      color: #fff;
      text-align: center;
      gap: 12px;
      transition: background 0.25s ease;
    }
    .card:hover .card-link-box {
      background: #1c1c22;
    }
    .card-link-box .link-badge {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .1em;
      opacity: .6;
      text-transform: uppercase;
    }
    .card-link-box .link-title {
      font-size: clamp(22px, 4.5cqw, 36px);
      font-weight: 600;
      letter-spacing: -.02em;
    }
    .card-link-box .link-url {
      font-family: var(--mono);
      font-size: 12px;
      opacity: .5;
    }

    /* Etichette ai lati */
    .meta {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      display: grid;
      gap: 4px;
      pointer-events: none;
    }
    .meta-left {
      left: max(32px, env(safe-area-inset-left, 0px));
      max-width: 280px;
    }
    .meta .small {
      color: var(--muted);
      font-size: 11px;
    }
    .meta .big {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -.01em;
      color: var(--fg);
    }
    .meta .desc {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      max-width: 260px;
      margin-top: 2px;
    }
    .swap { display: block; }

    @media (max-width: 700px) {
      .stack {
        left: 0;
        width: 100%;
        transform: none;
        top: 60px;
        bottom: 80px;
        overflow: hidden;
        -webkit-mask: linear-gradient(transparent, #000 6%, #000 94%, transparent);
        mask: linear-gradient(transparent, #000 6%, #000 94%, transparent);
      }
      .meta {
        top: auto;
        bottom: calc(30px + env(safe-area-inset-bottom, 0px));
        transform: none;
        left: 20px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .swap { animation: none; }
    }

      { name: "Vecellio Legno — Asset 01", cat: "Vecellio Legno", slug: "vecellio-legno-asset-01", type: "image", src: "projects/progetti_valtnet/vecellio/vecellio-progetto-1.png", ratio: 0.724, desc: "Visual asset from the Vecellio Legno project." },
      { name: "Vecellio Legno — Asset 02", cat: "Vecellio Legno", slug: "vecellio-legno-asset-02", type: "video", src: "projects/progetti_valtnet/vecellio/vecellio-progetto-2.mp4", poster: "projects/progetti_valtnet/vecellio/vecellio-progetto-2-poster.webp", ratio: 1.778, desc: "Motion asset for the Vecellio Legno project." }
    ];
    const PROJECTS = RAW_PROJECTS;

    const N = PROJECTS.length;
    const SLOTS = N * 2;
    const TILT = -30;
    const BASE_SPEED = 0.38;
    const NEAR_PX = 200;
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const isMobile = matchMedia("(pointer: coarse)").matches || innerWidth <= 700;

    const hero = document.getElementById("hero");
    const stack = document.getElementById("stack");
    const metaCat = document.getElementById("metaCat");
    const metaName = document.getElementById("metaName");
    const metaDesc = document.getElementById("metaDesc");

    // ---------- Preloading completo e decodifica preventiva in memoria ----------
    async function preloadAllAssets() {
      const progressEl = document.getElementById("preloaderProgress");
      // Su mobile evitiamo il download massivo parallelo di tutte le immagini
      if (isMobile) {
        if (progressEl) progressEl.textContent = "100%";
        return;
      }
      let count = 0;
      const total = PROJECTS.length;

      function step() {
        count++;
        const pct = Math.min(100, Math.round((count / total) * 100));
        if (progressEl) progressEl.textContent = pct + "%";
      }

      const tasks = PROJECTS.map(p => {
        const imgSrc = (p.type === "image" && p.src) ? p.src : (p.type === "video" && p.poster ? p.poster : null);
        if (imgSrc) {
          return new Promise(resolve => {
            const img = new Image();
            img.src = encodeURI(imgSrc);
            if (img.decode) {
              img.decode().then(() => { step(); resolve(); }).catch(() => { step(); resolve(); });
            } else {
              img.onload = img.onerror = () => { step(); resolve(); };
            }
          });
        } else {
          step();
          return Promise.resolve();
        }
      });

      const maxTimeout = new Promise(resolve => setTimeout(resolve, 4000));
      await Promise.race([Promise.all(tasks), maxTimeout]);
    }

    // ---------- Costruzione schede ----------
    function buildCardContent(p) {
      if (p.type === "video") {
        const safeSrc = encodeURI(p.src);
        const posterAttr = p.poster ? ` poster="${encodeURI(p.poster)}"` : "";
        return `<div class="card-media">
          <video muted loop playsinline webkit-playsinline preload="metadata"${posterAttr} data-src="${safeSrc}"></video>
        </div>`;
      }
      if (p.type === "lottie") {
        return `<div class="card-media lottie-container" data-lottie-id="${p.lottieId}"></div>`;
      }
      if (p.type === "link") {
        return `<div class="card-link-box">
          <span class="link-badge">WEBSITE ↗</span>
          <span class="link-title">${p.cat}</span>
          <span class="link-url">${p.link.replace(/^https?:\/\//, '')}</span>
        </div>`;
      }
      return `<div class="card-media">
        <img data-src="${encodeURI(p.src)}" alt="${p.name}" loading="lazy" decoding="async">
      </div>`;
    }

    // Carica i media (immagine/video/lottie) solo quando la card è vicina al fronte
    function hydrateMedia(card) {
      const img = card.querySelector("img[data-src]");
      if (img) {
        img.src = img.dataset.src;
        img.removeAttribute("data-src");
        return true;
      }
      const v = card.querySelector("video[data-src]");
      if (v) {
        const src = v.dataset.src;
        v.removeAttribute("data-src");
        v.preload = "auto";
        v.src = src;
        const s = document.createElement("source");
        s.src = src;
        s.type = "video/mp4";
        v.appendChild(s);
        v.load();
        return true;
      }
      const lc = card.querySelector(".lottie-container[data-lottie-id]:not([data-loaded])");
      if (lc && window.lottie && window.VALTNET_LOTTIE) {
        const animData = window.VALTNET_LOTTIE[lc.dataset.lottieId];
        if (animData) {
          const idx = +card.dataset.slot;
          lc.setAttribute("data-loaded", "true");
          lottieAnims[idx] = window.lottie.loadAnimation({
            container: lc,
            renderer: "svg",
            loop: true,
            autoplay: false,
            animationData: animData
          });
          return true;
        }
      }
      return false;
    }

    const scene = document.createElement("div");
    scene.className = "scene";
    stack.appendChild(scene);
    const cards = [];
    const lottieAnims = [];

    for (let i = 0; i < SLOTS; i++) {
      const p = PROJECTS[i % N];
      const a = document.createElement("a");
      a.className = "card";
      a.href = "#" + p.slug;
      a.dataset.slot = i;
      a.setAttribute("aria-label", `${p.name}, ${p.cat}`);
      if (i >= N) { a.tabIndex = -1; a.setAttribute("aria-hidden", "true"); }
      a.innerHTML = buildCardContent(p);

      // Assicura proprietà di autoplay silenzioso per WebKit/iOS/Safari
      const v = a.querySelector("video");
      if (v) {
        v.muted = true;
        v.defaultMuted = true;
        v.playsInline = true;
        v.setAttribute("muted", "");
        v.setAttribute("playsinline", "");
        v.setAttribute("webkit-playsinline", "");
      }

      scene.appendChild(a);
      cards.push(a);
    }

    // Sblocco video al primo evento utente
    function unlockVideos() {
      document.querySelectorAll(".card video").forEach(v => {
        v.muted = true;
        v.defaultMuted = true;
        v.playsInline = true;
      });
      for (let i = 0; i < SLOTS; i++) {
        if (Math.abs(ts[i]) < 4.2 || i === selected) {
          const v = cards[i].querySelector("video");
          if (v && v.paused) v.play().catch(() => {});
        }
      }
    }
    ["pointerdown", "touchstart", "wheel", "keydown", "click"].forEach(evt => {
      window.addEventListener(evt, unlockVideos, { passive: true });
    });

    // Inizializza animazioni Lottie locali
    function initLotties() {
      if (!window.lottie || !window.VALTNET_LOTTIE) return;
      cards.forEach((card, idx) => {
        const container = card.querySelector(".lottie-container");
        if (container && !container.hasAttribute("data-loaded")) {
          container.setAttribute("data-loaded", "true");
          const id = container.dataset.lottieId;
          const animData = window.VALTNET_LOTTIE[id];
          if (animData) {
            const anim = window.lottie.loadAnimation({
              container: container,
              renderer: "svg",
              loop: true,
              autoplay: false,
              animationData: animData
            });
            lottieAnims[idx] = anim;
          }
        }
      });
    }

    // ---------- Dimensioni e Prospettiva 3D ----------
    let W, H, P, DY, DZ, Y0, SP, FRONT_Y, FRONT_Z, BACK_Y, BACK_Z, LIFT_Z, STACK_H;
    const cardW = new Float32Array(SLOTS);
    const cardH = new Float32Array(SLOTS);
    const cardSelW = new Float32Array(SLOTS);
    const cardSelH = new Float32Array(SLOTS);

    function measure() {
      const vw = innerWidth;
      const small = vw <= 700;
      W = small ? Math.min(vw * 0.84, 440) : Math.min(600, vw * 0.44, hero.clientHeight * 0.72);
      H = W * 0.625;
      const targetArea = W * H;

      P = W * 4.3;
      DZ = W * 0.143;
      DY = W * 0.071;
      Y0 = H * 0.55;
      SP = W * 0.12;
      const sinT = Math.abs(Math.sin(TILT * Math.PI / 180));
      FRONT_Z = DZ * 0.4;
      FRONT_Y = H * 0.3;
      BACK_Z = -H * sinT * 0.95;
      BACK_Y = -H * 0.12;
      LIFT_Z = DZ * 0.5;

      STACK_H = stack.clientHeight;
      const maxSelW = small ? vw * 0.94 : Math.min(vw * 0.86, 1200);
      const maxSelH = small ? (STACK_H - 100) : (STACK_H - 120);

      for (let i = 0; i < SLOTS; i++) {
        const p = PROJECTS[i % N];
        const r = p.ratio || 1.6;
        const rClamp = Math.max(0.55, Math.min(3.4, r));

        let ch = Math.sqrt(targetArea / rClamp);
        let cw = ch * rClamp;

        if (small && cw > vw * 0.88) {
          cw = vw * 0.88;
          ch = cw / rClamp;
        }

        cardW[i] = cw;
        cardH[i] = ch;

        if (maxSelW / maxSelH > r) {
          cardSelH[i] = maxSelH;
          cardSelW[i] = maxSelH * r;
        } else {
          cardSelW[i] = maxSelW;
          cardSelH[i] = maxSelW / r;
        }

        const c = cards[i];
        c.style.width = cw.toFixed(1) + "px";
        c.style.height = ch.toFixed(1) + "px";
        c.style.left = `calc(50% - ${(cw / 2).toFixed(1)}px)`;
        c.style.marginTop = (-ch / 2).toFixed(1) + "px";
      }

      hero.style.setProperty("--w", W + "px");
      hero.style.setProperty("--h", H + "px");
      stack.style.perspective = P + "px";
      stack.style.perspectiveOrigin = `50% ${-(W * 1.25)}px`;
    }
    measure();
    addEventListener("resize", measure);

    // ---------- Stato ----------
    let pos = 0, target = 0, speed = reduceMotion ? 0 : BASE_SPEED;
    let hovered = -1;
    const open = new Float32Array(SLOTS);
    const mouse = { x: -9999, y: -9999, inside: false, type: "mouse" };
    let touchHold = false, resumeTimer = null;
    const sel = new Float32Array(SLOTS);
    const sized = new Uint8Array(SLOTS);
    const ts = new Float32Array(SLOTS);
    const openV = new Float32Array(SLOTS), selV = new Float32Array(SLOTS);
    let posV = 0;
    let selected = -1, candSlot = -2, candT = 0;

    const wrap = (v) => { const h = SLOTS / 2; return ((((v + h) % SLOTS) + SLOTS) % SLOTS) - h; };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const damp = (k, dt) => 1 - Math.exp(-k * dt);

    // ---------- Etichetta laterale ----------
    let shownProject = -2;
    function swapText(el, text) {
      if (el.textContent === text) return;
      el.textContent = text;
      el.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 420, easing: "cubic-bezier(.2,.7,.2,1)" });
    }
    function updateMeta() {
      const p = hovered >= 0 ? hovered % N : -1;
      if (p === shownProject) return;
      shownProject = p;
      if (p < 0) {
        swapText(metaCat, "Indice");
        swapText(metaName, "Archivio progetti");
        swapText(metaDesc, "Visual design, motion and photography.");
      } else {
        swapText(metaCat, PROJECTS[p].cat);
        swapText(metaName, PROJECTS[p].name);
        swapText(metaDesc, PROJECTS[p].desc || "");
      }
    }

    // ---------- Selezione Card ----------
    function select(slot) {
      selected = slot;
      hovered = slot;
      hydrateMedia(cards[slot]);
      const v = cards[slot].querySelector("video");
      if (v) {
        v.muted = true;
        v.play().catch(() => {});
      }
    }
    function close() {
      if (selected < 0) return;
      selected = -1;
      candSlot = -2;
      const a = document.activeElement;
      if (a && a.closest && a.closest(".card")) a.blur();
      if (mouse.type !== "mouse") {
        hovered = -1;
        clearTimeout(resumeTimer);
        resumeTimer = setTimeout(() => { touchHold = false; }, 1200);
      }
    }
    addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

    // ---------- Input: Mouse ----------
    addEventListener("pointermove", (e) => {
      mouse.type = e.pointerType;
      if (e.pointerType !== "mouse") return;
      mouse.x = e.clientX; mouse.y = e.clientY; mouse.inside = true;
    }, { passive: true });
    addEventListener("pointerdown", (e) => {
      mouse.type = e.pointerType;
      if (e.pointerType !== "mouse") mouse.inside = false;
    }, { capture: true, passive: true });
    document.addEventListener("pointerleave", () => { mouse.inside = false; });
    addEventListener("blur", () => { mouse.inside = false; });
    stack.addEventListener("mousedown", (e) => e.preventDefault());

    // Rotella
    stack.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (selected >= 0) return;
      let d = e.deltaY;
      if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= innerHeight;
      target += d / SP * 0.55;
    }, { passive: false });

    // ---------- Input: Touch ----------
    let drag = null;
    stack.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse") return;
      touchHold = true;
      clearTimeout(resumeTimer);
      drag = { id: e.pointerId, y0: e.clientY, y: e.clientY, t: performance.now(), v: 0, moved: 0 };
      stack.setPointerCapture(e.pointerId);
    });
    stack.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const now = performance.now(), dy = e.clientY - drag.y;
      if (selected < 0) {
        target -= dy / SP;
        drag.v = 0.8 * drag.v + 0.2 * (dy / Math.max(1, now - drag.t));
      }
      drag.y = e.clientY; drag.t = now; drag.moved += Math.abs(dy);
    });
    const endDrag = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      if (drag.moved < 8) {
        const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".card");
        if (el) {
          const slot = +el.dataset.slot;
          selected === slot ? close() : select(slot);
        } else close();
      } else if (selected < 0) {
        target -= drag.v * 260 / SP;
        hovered = -1;
      }
      drag = null;
      if (selected < 0 && hovered < 0) resumeTimer = setTimeout(() => { touchHold = false; }, 1800);
    };
    stack.addEventListener("pointerup", endDrag);
    stack.addEventListener("pointercancel", endDrag);
    hero.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse" && selected >= 0 && !e.target.closest(".stack")) close();
    });

    // ---------- Click ----------
    hero.addEventListener("click", (e) => {
      const el = e.target.closest(".card");
      if (el) e.preventDefault();
      if (mouse.type !== "mouse" && e.detail !== 0) return;
      if (el) {
        const slot = +el.dataset.slot;
        if (selected === slot) {
          const p = PROJECTS[slot % N];
          if (p.type === "link" && p.link) {
            window.open(p.link, "_blank", "noopener");
          } else {
            close();
          }
        } else {
          select(slot);
        }
      } else if (selected >= 0) {
        close();
      }
    });

    // Focus tastiera
    stack.addEventListener("focusin", (e) => {
      const el = e.target.closest(".card"); if (!el) return;
      const slot = +el.dataset.slot;
      if (selected >= 0) { select(slot); return; }
      hovered = slot; target = pos + wrap(slot - pos);
    });
    stack.addEventListener("focusout", () => {
      if (selected < 0 && (mouse.type !== "mouse" || !mouse.inside)) hovered = -1;
    });

    // ---------- Loop di Animazione ----------
    const ease = (v) => v * v * v * (v * (v * 6 - 15) + 10);
    const spring = (x, v, goal, w, dt) => {
      v += (-w * w * (x - goal) - 2 * w * v) * dt;
      x += v * dt;
      return [x, v];
    };

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const hr = hero.getBoundingClientRect();
      const sr = stack.getBoundingClientRect();
      const hasSel = selected >= 0;

      // 1) Prossimità mouse
      let near = 0;
      if (!hasSel && mouse.type === "mouse" && mouse.inside && mouse.y >= hr.top && mouse.y <= hr.bottom) {
        const dx = Math.max(sr.left - mouse.x, 0, mouse.x - sr.right);
        near = clamp(1 - dx / NEAR_PX, 0, 1);
        near = near * near * (3 - 2 * near);
      }

      // 2) Hover intention
      if (hasSel) {
        hovered = selected;
        candSlot = -2;
      } else if (mouse.type === "mouse" && !drag && document.activeElement?.closest?.(".card") == null) {
        let slot = -1;
        if (mouse.inside && mouse.y >= hr.top && mouse.y <= hr.bottom) {
          const el = document.elementFromPoint(mouse.x, mouse.y);
          const c = el && el.closest(".card");
          if (c) slot = +c.dataset.slot;
        }
        if (slot !== candSlot) { candSlot = slot; candT = now; }
        if (slot !== hovered && now - candT > (slot < 0 ? 170 : 90)) hovered = slot;
      }

      // 3) Velocità loop
      const paused = reduceMotion || touchHold || hovered >= 0 || hasSel || document.hidden;
      const targetSpeed = paused ? 0 : BASE_SPEED * (1 - near);
      speed += (targetSpeed - speed) * damp(targetSpeed < speed ? 2.0 : 1.1, dt);
      target += speed * dt;
      [pos, posV] = spring(pos, posV, target, 4.2, dt);

      // 4) Apertura e ingrandimento
      let m1 = 0, m2 = 0, idx1 = -1;
      for (let i = 0; i < SLOTS; i++) {
        let r = spring(open[i], openV[i], i === hovered ? 1 : 0, 6, dt);
        open[i] = clamp(r[0], 0, 1); openV[i] = r[1];
        r = spring(sel[i], selV[i], i === selected ? 1 : 0, 5, dt);
        sel[i] = clamp(r[0], 0, 1); selV[i] = r[1];
        const s = sel[i];
        if (s > m1) { m2 = m1; m1 = s; idx1 = i; } else if (s > m2) m2 = s;
      }

      // 5) Posizionamento e rendering
      for (let i = 0; i < SLOTS; i++) ts[i] = wrap(i - pos);
      for (let i = 0; i < SLOTS; i++) {
        const t = ts[i];
        const absT = Math.abs(t);
        const c = cards[i];

        if (absT > 6.9 && i !== selected) {
          if (c.style.visibility !== "hidden") {
            c.style.visibility = "hidden";
            const v = c.querySelector("video");
            if (v && !v.paused) v.pause();
            if (lottieAnims[i]) lottieAnims[i].pause();
          }
          continue;
        }

        if (c.style.visibility === "hidden") {
          c.style.visibility = "visible";
        }

        let offY = 0, offZ = 0;
        for (let k = 0; k < SLOTS; k++) {
          if (k === i || open[k] < 0.002) continue;
          const d = wrap(t - ts[k]);
          const g = clamp(open[k] * 2.4, 0, 1);
          const e = (g * g * (3 - 2 * g)) * clamp(Math.abs(d) * 1.5, 0, 1);
          if (d > 0) { offY += FRONT_Y * e; offZ += FRONT_Z * e; }
          else { offY += BACK_Y * e; offZ += BACK_Z * e; }
        }
        const oe = ease(open[i]);
        let y = Y0 + t * DY + offY + oe * H * 0.12;
        let z = t * DZ + offZ + oe * LIFT_Z;
        let rot = TILT * (1 - oe);
        const FADE_START = 4.2;
        const FADE_END = 6.4;
        const fe = clamp((FADE_END - absT) / (FADE_END - FADE_START), 0, 1);
        let op = fe * fe * (3 - 2 * fe);

        // Sollevamento: le card salgono più in alto prima di scomparire
        const rise = (1 - fe) * H * 0.7;
        y -= rise;

        const others = i === idx1 ? m2 : m1;
        op *= 1 - ease(clamp(others * 2.2, 0, 1));

        const ue = ease(sel[i]);
        if (ue > 0.0005) {
          const curW = cardW[i] + (cardSelW[i] - cardW[i]) * ue;
          const curH = cardH[i] + (cardSelH[i] - cardH[i]) * ue;
          y *= (1 - ue);
          z *= (1 - ue);
          rot *= (1 - ue);
          op += (1 - op) * ue;
          c.style.width = curW.toFixed(1) + "px";
          c.style.height = curH.toFixed(1) + "px";
          c.style.left = `calc(50% - ${(curW / 2).toFixed(1)}px)`;
          c.style.marginTop = (-curH / 2).toFixed(1) + "px";
          sized[i] = 1;
        } else if (sized[i]) {
          c.style.width = cardW[i].toFixed(1) + "px";
          c.style.height = cardH[i].toFixed(1) + "px";
          c.style.left = `calc(50% - ${(cardW[i] / 2).toFixed(1)}px)`;
          c.style.marginTop = (-cardH[i] / 2).toFixed(1) + "px";
          sized[i] = 0;
        }

        c.style.transform = `translate3d(0, ${y.toFixed(2)}px, ${z.toFixed(2)}px) rotateX(${rot.toFixed(2)}deg)`;
        c.style.opacity = op.toFixed(3);
        c.classList.toggle("is-open", open[i] > 0.5 || ue > 0.05);
        c.classList.toggle("is-selected", i === selected);

        // Carica i media quando la card è visibile o vicina al fronte
        const isVisible = absT < 6.5 || i === selected;
        if (isVisible) hydrateMedia(c);

        // Riproduci i video quando la card è vicina al fronte
        const isNearFront = (absT < 4.2 && op > 0.08) || i === selected;
        const v = c.querySelector("video");
        if (v) {
          if (isNearFront) {
            if (v.paused && !v.dataset.pendingPlay) {
              v.dataset.pendingPlay = "1";
              v.play()
                .catch(() => {})
                .finally(() => {
                  delete v.dataset.pendingPlay;
                });
            }
          } else {
            delete v.dataset.pendingPlay;
            if (!v.paused) v.pause();
          }
        }
        if (lottieAnims[i]) {
          if (isNearFront) {
            if (lottieAnims[i].isPaused) lottieAnims[i].play();
          } else {
            if (!lottieAnims[i].isPaused) lottieAnims[i].pause();
          }
        }
      }
      scene.classList.toggle("has-sel", hasSel);

      updateMeta();
      requestAnimationFrame(frame);
    }

    // Inizializza lottie, esegue preload completo asincrono e rivela la scena al 100%
    preloadAllAssets().then(() => {
      setTimeout(() => {
        document.body.classList.add("preloader-done");
        // Assicura stato audio/video corretto
        document.querySelectorAll(".card video").forEach(v => {
          v.muted = true;
          v.defaultMuted = true;
          v.playsInline = true;
        });
        requestAnimationFrame(frame);
      }, 150);
    });
  })();
  </script>
</body>
</html>
